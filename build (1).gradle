plugins {
    id 'com.android.application'
}

android {
    namespace 'hu.djstudio.app'
    compileSdk 34

    defaultConfig {
        applicationId 'hu.djstudio.app'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '2.1'
    }

    signingConfigs {
        // fixed key in the project, so every new build installs over the previous one
        djstudio {
            storeFile file('djstudio.keystore')
            storePassword 'djstudio2'
            keyAlias 'djstudio'
            keyPassword 'djstudio2'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.djstudio
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}
