plugins {
    id 'com.android.application'
}

android {
    namespace 'hu.djstudio.app'
    compileSdk 34

    defaultConfig {
        applicationId 'hu.djstudio.app'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // signed with the auto-generated debug key so the APK can be installed directly
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}
