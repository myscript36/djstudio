name: DJ Studio APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK fordítása
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK átnevezése
        run: cp app/build/outputs/apk/release/app-release.apk DJStudio-2.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DJStudio-2.0-APK
          path: DJStudio-2.0.apk
